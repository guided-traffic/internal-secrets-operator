name: Vulnerability Watch

# The "Vulnerability Check" status check is required for merging. A CVE published
# against an existing dependency turns main red without any commit, which silently
# blocks every open PR (including all Renovate updates). This workflow surfaces
# that as a tracked issue instead of letting it be discovered by a stuck PR.

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  GO_VERSION: '1.27.3'

jobs:
  govulncheck:
    name: Vulnerability Check (main)
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install dependencies
        run: go mod download

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Run vulnerability check
        id: vuln
        # Explicit `shell: bash` runs with `-o pipefail`. The implicit default
        # (`bash -e`) takes the exit code of `tee`, which reported this step as
        # green while govulncheck failed.
        shell: bash
        run: make vuln 2>&1 | tee vuln-report.txt

      # github-script instead of the gh CLI: the self-hosted runner image does
      # not ship gh, so this step used to fail with "gh: command not found".
      - name: Report vulnerabilities as issue
        if: failure() && steps.vuln.outcome == 'failure'
        uses: actions/github-script@v9
        env:
          TITLE: 'govulncheck: main is affected by known vulnerabilities'
        with:
          script: |
            const fs = require('fs');
            const title = process.env.TITLE;
            const report = fs.readFileSync('vuln-report.txt', 'utf8');
            // Vulnerability IDs come first, the summary line last; issue bodies
            // are capped at 65536 characters.
            const excerpt = report.length > 40000
              ? `${report.slice(0, 37000)}\n[...]\n${report.slice(-3000)}`
              : report;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `govulncheck failed on \`main\` (run: ${runUrl}).`,
              '',
              'Every open PR is blocked until this is fixed, because "Vulnerability Check" is a required status check.',
              '',
              '```',
              excerpt,
              '```',
            ].join('\n');
            const open = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', per_page: 100,
            });
            const existing = open.find((i) => !i.pull_request && i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
              core.info(`Commented on #${existing.number}`);
            } else {
              const { data } = await github.rest.issues.create({
                ...context.repo, title, body, labels: ['dependencies', 'security'],
              });
              core.info(`Created #${data.number}`);
            }
